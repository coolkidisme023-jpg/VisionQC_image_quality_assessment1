server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # env-config.js must never be cached - it's regenerated per-container-start.
    location = /env-config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
